<div [class.dark]="state.isDarkMode()" class="min-h-screen">
  <div class="min-h-screen bg-[#F8FAFC] dark:bg-[#071015] text-slate-900 dark:text-slate-100 flex flex-row transition-colors">
    <!-- Desktop Left Sidebar (Matching Screenshot 1 & 2) -->
    <div class="hidden lg:block shrink-0">
      <app-sidebar />
    </div>

    <!-- Main Workspace Area -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen">
      <!-- Top Navigation Bar -->
      <app-topbar />

      <!-- View Content Router -->
      <main [class]="state.activeView() === 'vscode' || state.activeView() === 'study' ? 'flex-1 p-2 sm:p-4 overflow-y-auto' : 'flex-1 p-4 sm:p-8 lg:p-10 overflow-y-auto'">
        @switch (state.activeView()) {
          @case ('overview') {
            <app-overview />
          }
          @case ('curriculum') {
            <app-curriculum />
          }
          @case ('playground') {
            <app-playground />
          }
          @case ('simulators') {
            <app-simulators />
          }
          @case ('surge') {
            <app-surge-hub />
          }
          @case ('vscode') {
            <app-vscode-editor />
          }
          @case ('study') {
            <app-study-reader />
          }
        }
      </main>

      <!-- Clean Minimal Footer -->
      <footer class="px-6 py-4 border-t border-slate-200/80 dark:border-slate-800/80 bg-white/50 dark:bg-[#0D181E]/50 text-xs text-slate-500 dark:text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="font-bold text-slate-800 dark:text-slate-200">PyAdvance Academy</span>
          <span>&middot;</span>
          <span>Advanced Python &amp; OOP Mastery based on T&#92; Sondos Saif's Lectures</span>
        </div>
        <div class="flex items-center gap-3">
          <button
            (click)="state.setView('surge')"
            class="text-teal-600 dark:text-teal-400 font-semibold hover:underline flex items-center gap-1">
            <mat-icon class="text-xs">cloud_upload</mat-icon>
            <span>Deploy to Surge.sh</span>
          </button>
          <span>&middot;</span>
          <span class="font-mono text-[11px] text-slate-400">v2.4 LTS</span>
        </div>
      </footer>
    </div>
  </div>
</div>
